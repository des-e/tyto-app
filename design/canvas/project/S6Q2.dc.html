<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Тихий первый запуск, темная тема</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0} button{font:inherit;color:inherit}</style>
</helmet>
<div style="position: relative; width: 1000px; height: 640px; background: {{bg}}; font-family: Geist, system-ui, sans-serif; color: {{ink}}; display: flex; flex-direction: column; align-items: center; justify-content: center;">
  <svg viewBox="262 200 500 680" width="40" height="54" fill="{{ink}}" aria-hidden="true"><path fill-rule="evenodd" d="M276 214L396 296Q512 336 628 296L748 214L748 620C748 750 640 830 512 830C384 830 276 750 276 620ZM322 448A92 92 0 1 0 506 448A92 92 0 1 0 322 448ZM518 448A92 92 0 1 0 702 448A92 92 0 1 0 518 448ZM480 556L512 612L544 556Z"></path><path d="M362 448A52 52 0 1 1 466 448A52 52 0 1 1 362 448ZM558 448A52 52 0 1 1 662 448A52 52 0 1 1 558 448Z"></path><rect x="412" y="812" width="56" height="52" rx="18"></rect><rect x="556" y="812" width="56" height="52" rx="18"></rect></svg>
  <h1 style="margin: 24px 0 0 0; font-size: 15px; font-weight: 500;">Tyto готовится <span style="color: {{muted}}; font-weight: 400;">·</span> <span style="font-family: 'Geist Mono', monospace; font-size: 14px;">17%</span></h1>
  <div role="progressbar" aria-label="Загрузка моделей" aria-valuenow="17" aria-valuemin="0" aria-valuemax="100" style="width: 220px; height: 3px; margin-top: 14px; border-radius: 2px; background: {{track}}; position: relative;"><span style="position: absolute; left: 0; top: 0; height: 3px; width: 17%; border-radius: 2px; background: {{ink}};"></span></div>
  <p style="margin: 14px 0 0 0; font-size: 13px; color: {{muted}};">Скачиваем модели один раз, около 5 минут</p>
  <div style="position: absolute; bottom: 28px; display: flex; gap: 18px; font-size: 12.5px; color: {{muted}};">
    <button type="button" style="border: 0; background: transparent; padding: 0; color: inherit; cursor: pointer;">Указать файлы вручную</button>
    <button type="button" style="border: 0; background: transparent; padding: 0; color: inherit; cursor: pointer;">Отменить</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1000,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark !== false;
    return dark
      ? { bg: '#0a0a0a', ink: '#ededed', muted: '#a1a1a1', track: '#262626' }
      : { bg: '#ffffff', ink: '#171717', muted: '#666666', track: '#ebebeb' };
  }
}
</script>
</body>
</html>
