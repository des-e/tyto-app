<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Запись до расшифровки, вариант A</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 1000px; height: 640px; display: flex; font-family: Geist, system-ui, sans-serif; color: #171717; background: #fff; overflow: hidden;">
  <dc-import name="Sidebar" hint-size="232px,640px"></dc-import>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
    <main style="flex: 1; min-height: 0; padding: 64px 56px 0 56px; display: flex; flex-direction: column; gap: 28px;">
      <header>
        <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em;">Запись 10∶35</h1>
        <p style="margin: 6px 0 0 0; font-size: 13px; color: #666;">3 ноября, 10:35 · <span style="font-family: 'Geist Mono', monospace;">0:12</span> · звук и экран</p>
      </header>
      <section aria-labelledby="s2a-run" style="border: 1px solid #eaeaea; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px;">
        <h2 id="s2a-run" style="margin: 0; font-size: 15px; font-weight: 600;">Расшифровать запись</h2>
        <div style="display: flex; align-items: flex-end; gap: 12px;">
          <label style="display: flex; flex-direction: column; gap: 6px; flex: 1; font-size: 12px; font-weight: 500; color: #666;">Язык встречи
            <span style="height: 36px; border: 1px solid #e1e1e1; border-radius: 8px; padding: 0 10px; display: flex; align-items: center; justify-content: space-between; font-size: 13.5px; font-weight: 400; color: #171717;">Русский <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px; flex: 1; font-size: 12px; font-weight: 500; color: #666;">Говорящие
            <span style="height: 36px; border: 1px solid #e1e1e1; border-radius: 8px; padding: 0 10px; display: flex; align-items: center; justify-content: space-between; font-size: 13.5px; font-weight: 400; color: #171717;">Определить сами <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
          </label>
          <button type="button" style="height: 36px; padding: 0 18px; border: 0; border-radius: 8px; background: #171717; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer;">Расшифровать</button>
        </div>
        <button type="button" style="align-self: flex-start; border: 0; background: transparent; padding: 0; font-size: 13px; color: #666; text-decoration: underline; text-decoration-color: #d4d4d4; text-underline-offset: 3px; cursor: pointer;">Еще настройки</button>
      </section>
      <div style="flex: 1; border-top: 1px dashed #d4d4d4; padding-top: 16px; font-size: 13px; color: #8f8f8f;">Здесь появится текст по говорящим</div>
    </main>
    <dc-import name="Player" hint-size="768px,56px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":640}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
