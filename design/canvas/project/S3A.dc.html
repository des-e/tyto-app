<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Расшифровка, вариант A</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 1000px; height: 640px; display: flex; font-family: Geist, system-ui, sans-serif; color: #171717; background: #fff; overflow: hidden;">
  <dc-import name="Sidebar" active="Планерка отдела продаж" hint-size="232px,640px"></dc-import>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
    <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; padding: 0 16px 0 40px; gap: 4px;">
      <div role="tablist" aria-label="Вид записи" style="display: flex; gap: 2px;">
        <button type="button" role="tab" aria-selected="true" style="height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: #ebebeb; font-size: 13px; font-weight: 500;">Текст</button>
        <button type="button" role="tab" aria-selected="false" style="height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; font-size: 13px; color: #666;">Сводка</button>
      </div>
      <span style="flex: 1;"></span>
      <button type="button" aria-label="Поиск по тексту" style="width: 30px; height: 30px; border: 0; background: transparent; color: #666; display: grid; place-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></button>
      <button type="button" aria-label="Вид текста" style="width: 30px; height: 30px; border: 0; background: transparent; color: #666; display: grid; place-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M20 7h-9"></path><path d="M14 17H5"></path><circle cx="17" cy="17" r="3"></circle><circle cx="7" cy="7" r="3"></circle></svg></button>
      <button type="button" style="margin-left: 6px; height: 30px; padding: 0 12px; border: 1px solid #e1e1e1; border-radius: 6px; background: #fff; font-size: 13px; font-weight: 500;">Экспорт</button>
    </div>
    <main style="flex: 1; min-height: 0; padding: 16px 40px 0 40px; overflow: hidden;">
      <header style="margin: 0 0 22px 76px;">
        <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em;">Планерка отдела продаж</h1>
        <div style="display: flex; align-items: center; gap: 14px; margin-top: 8px; font-size: 13px; color: #666;">
          <span>29 октября · <span style="font-family: 'Geist Mono', monospace;">48:00</span> · русский</span>
          <span style="display: flex; gap: 6px;">
            <sc-for list="{{people}}" as="p" hint-placeholder-count="3"><span style="display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px 0 3px; border-radius: 11px; background: {{p.tint}}; color: #171717; font-size: 12px;"><span style="width: 16px; height: 16px; border-radius: 8px; background: #fff; display: grid; place-items: center; font-size: 10px; font-weight: 600;">{{p.initial}}</span>{{p.name}}</span></sc-for>
          </span>
        </div>
      </header>
      <sc-for list="{{lines}}" as="line" hint-placeholder-count="6">
        <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr); column-gap: 12px; padding-top: {{line.gap}};">
          <span style="text-align: right; font-family: 'Geist Mono', monospace; font-size: 11.5px; color: {{line.timeColor}}; padding-top: {{line.timePad}};">{{line.time}}</span>
          <div>
            <sc-if value="{{line.first}}" hint-placeholder-val="{{true}}"><div style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; margin-bottom: 2px;"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{line.dot}};"></span>{{line.who}}</div></sc-if>
            <p style="margin: 0 0 0 -8px; padding: 2px 8px; border-radius: 6px; background: {{line.bg}}; font-size: 15px; line-height: 1.6; max-width: 600px;">{{line.text}}</p>
          </div>
        </div>
      </sc-for>
    </main>
    <dc-import name="Player" time="0:14" total="48:00" progress="1%" hint-size="768px,56px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const tint = { 'Денис': ['#e6effd', '#5b8def'], 'Ольга Смирнова': ['#fdeee2', '#e8915a'], 'Андрей': ['#e3f4ea', '#4fa877'] };
    const raw = [
      ['00:00', 'Денис', 'Давайте начнем с поставок. По второму складу сроки сдвигаются на неделю.'],
      ['00:09', 'Ольга Смирнова', 'Это из-за перевозчика? Они обещали машину на четверг.'],
      ['00:14', 'Ольга Смирнова', 'Если не успеют, клиенту надо сказать сегодня, а не в пятницу.', true],
      ['00:21', 'Денис', 'Да, перевозчик. Я напишу клиенту после созвона и предложу частичную отгрузку.'],
      ['00:33', 'Андрей', 'Частичную можем собрать к среде, остатки есть на первом складе.'],
      ['00:41', 'Денис', 'Отлично. Тогда фиксируем: среда, частичная отгрузка, остальное по факту.'],
    ];
    const lines = raw.map((r, i) => {
      const first = i === 0 || raw[i - 1][1] !== r[1];
      return { time: r[0], who: r[1], text: r[2], first: first, dot: tint[r[1]][1],
        gap: first && i > 0 ? '18px' : '2px', timePad: first ? '1px' : '6px',
        timeColor: r[3] ? '#171717' : '#8f8f8f', bg: r[3] ? '#f2f2f2' : 'transparent' };
    });
    const people = Object.keys(tint).map((name) => ({ name: name.split(' ')[0], initial: name[0], tint: tint[name][0] }));
    return { lines: lines, people: people };
  }
}
</script>
</body>
</html>
