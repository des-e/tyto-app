<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ход расшифровки, вариант A</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 1000px; height: 640px; display: flex; font-family: Geist, system-ui, sans-serif; color: #171717; background: #fff; overflow: hidden;">
  <dc-import name="Sidebar" active="Планерка отдела продаж" running="Планерка отдела продаж" hint-size="232px,640px"></dc-import>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
    <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; padding: 0 16px 0 32px; gap: 4px;">
      <button type="button" disabled style="height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; font-size: 13px; color: #b0b0b0;">Саммари</button>
      <button type="button" disabled style="height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; font-size: 13px; color: #b0b0b0;">Темы</button>
      <button type="button" disabled style="height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; font-size: 13px; color: #b0b0b0;">ИИ-разбор</button>
      <span style="flex: 1;"></span>
      <button type="button" disabled style="height: 30px; padding: 0 12px; border: 1px solid #eaeaea; border-radius: 6px; background: #fff; font-size: 13px; color: #b0b0b0;">Экспорт</button>
    </div>
    <main style="flex: 1; min-height: 0; padding: 12px 32px 0 32px; overflow: hidden;">
      <header style="margin: 0 0 18px 76px;">
        <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em;">Планерка отдела продаж</h1>
        <p style="margin: 6px 0 0 0; font-size: 13px; color: #666;">29 октября · <span style="font-family: 'Geist Mono', monospace;">48:00</span> · русский</p>
      </header>
      <section aria-label="Ход расшифровки" style="margin: 0 0 22px 76px; max-width: 560px; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: baseline; gap: 10px; font-size: 13.5px;">
          <span style="font-weight: 500;">Расшифровываем</span>
          <span style="font-family: 'Geist Mono', monospace; font-size: 12.5px;">64%</span>
          <span style="color: #666; font-size: 13px;">осталось около 3 мин</span>
          <span style="flex: 1;"></span>
          <button type="button" style="border: 0; background: transparent; padding: 0; font-size: 13px; color: #666; text-decoration: underline; text-decoration-color: #d4d4d4; text-underline-offset: 3px; cursor: pointer;">Остановить</button>
        </div>
        <div role="progressbar" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100" style="height: 4px; border-radius: 2px; background: #ebebeb; position: relative;"><span style="position: absolute; left: 0; top: 0; height: 4px; width: 64%; border-radius: 2px; background: #171717;"></span></div>
      </section>
      <sc-for list="{{lines}}" as="line" hint-placeholder-count="4">
        <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr); column-gap: 12px; padding-top: {{line.gap}};">
          <span style="text-align: right; font-family: 'Geist Mono', monospace; font-size: 11.5px; color: #8f8f8f; padding-top: {{line.timePad}};">{{line.time}}</span>
          <div>
            <sc-if value="{{line.first}}" hint-placeholder-val="{{true}}"><div style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; margin-bottom: 2px;"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{line.dot}};"></span>{{line.who}}</div></sc-if>
            <p style="margin: 0; font-size: 14.5px; line-height: 1.6; max-width: 560px;">{{line.text}}</p>
          </div>
        </div>
      </sc-for>
      <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr); column-gap: 12px; padding-top: 14px;">
        <span></span>
        <span style="display: flex; flex-direction: column; gap: 7px; padding-top: 4px;"><span style="height: 9px; width: 70%; border-radius: 4px; background: #f0f0f0;"></span><span style="height: 9px; width: 42%; border-radius: 4px; background: #f0f0f0;"></span></span>
      </div>
    </main>
    <dc-import name="Player" time="0:00" total="48:00" progress="0%" hint-size="768px,56px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const dot = { 'Говорящий 1': '#5b8def', 'Говорящий 2': '#e8915a', 'Говорящий 3': '#4fa877' };
    const raw = [
      ['30:41', 'Говорящий 1', 'Тогда по найму: кладовщика ищем до конца месяца, вакансию я выложу сегодня.'],
      ['30:52', 'Говорящий 3', 'Я поспрашиваю у ребят на первом складе, может кто-то посоветует.'],
      ['31:05', 'Говорящий 2', 'Хорошо. Переходим к итогам, у нас осталось минут пятнадцать.'],
    ];
    const lines = raw.map((r, i) => {
      const first = i === 0 || raw[i - 1][1] !== r[1];
      return { time: r[0], who: r[1], text: r[2], first: first, dot: dot[r[1]], gap: first && i > 0 ? '16px' : '2px', timePad: first ? '1px' : '6px' };
    });
    return { lines: lines };
  }
}
</script>
</body>
</html>
