<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Левая колонка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<aside style="width: 232px; height: 640px; background: #fafafa; border-right: 1px solid #eaeaea; display: flex; flex-direction: column; padding: 14px 8px 0 8px; box-sizing: border-box; font-family: Geist, system-ui, sans-serif; color: #171717;">
  <div style="display: flex; align-items: center; gap: 8px; padding: 4px 8px 14px 8px;">
    <span style="width: 12px; height: 12px; border-radius: 6px; background: #d4d4d4;"></span>
    <span style="width: 12px; height: 12px; border-radius: 6px; background: #d4d4d4;"></span>
    <span style="width: 12px; height: 12px; border-radius: 6px; background: #d4d4d4;"></span>
  </div>
  <div style="display: flex; align-items: center; gap: 8px; padding: 0 0 0 8px; height: 32px;">
    <svg viewBox="0 -114 396.81 142.61" width="61" height="22" fill="#171717" role="img" aria-label="Tyto"><g transform="translate(-57.35 -158.47) scale(0.21)"><path fill-rule="evenodd" d="M276 214L396 296Q512 336 628 296L748 214L748 620C748 750 640 830 512 830C384 830 276 750 276 620ZM322 448A92 92 0 1 0 506 448A92 92 0 1 0 322 448ZM518 448A92 92 0 1 0 702 448A92 92 0 1 0 518 448ZM480 556L512 612L544 556Z"></path><path d="M362 448A52 52 0 1 1 466 448A52 52 0 1 1 362 448ZM558 448A52 52 0 1 1 662 448A52 52 0 1 1 558 448Z"></path></g><g transform="translate(132.08 0)"><path d="M4.40 -109.00L25.94 -100.00Q44.29 -97.00 62.63 -100.00L84.17 -109.00V-83.98H4.40Z"></path><path d="M36.27 -85.98H52.3V0H36.27Z"></path><path d="M94.54 0.7 65.3 -68.61H82.89L102.8 -17.53H97.62L118.63 -68.61H136.36L104.61 0.7ZM74.24 28.61 95.51 -15.31 104.61 0.7 91.92 28.61Z"></path><path d="M158.76 0V-97.19H174.78V0ZM142.36 -54.11V-68.61H191.17V-54.11Z"></path><path fill-rule="evenodd" d="M192.67 -34.31A36.03 36.03 0 1 1 264.73 -34.31A36.03 36.03 0 1 1 192.67 -34.31ZM207.41 -34.31A21.29 21.29 0 1 0 249.99 -34.31A21.29 21.29 0 1 0 207.41 -34.31Z"></path><path d="M220.19 -34.31A8.52 8.52 0 1 1 237.22 -34.31A8.52 8.52 0 1 1 220.19 -34.31Z"></path></g></svg>
    <span style="flex: 1;"></span>
    <button type="button" aria-label="Поиск" style="width: 28px; height: 28px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 6px; color: #666;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></button>
    <button type="button" aria-label="Новая запись" style="width: 28px; height: 28px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 6px; color: #666;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
  </div>
  <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
    <p style="margin: 18px 8px 0 8px; font-size: 13px; line-height: 1.5; color: #666;">Здесь появятся ваши записи</p>
  </sc-if>
  <sc-if value="{{full}}" hint-placeholder-val="{{true}}">
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="7">
      <sc-if value="{{row.isLabel}}" hint-placeholder-val="{{false}}">
        <div style="font-size: 12px; font-weight: 500; color: #666; padding: 14px 8px 4px 8px;">{{row.label}}</div>
      </sc-if>
      <sc-if value="{{row.isItem}}" hint-placeholder-val="{{true}}">
        <a href="#" style="{{row.style}}">
          <span style="flex: 1; min-width: 0; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{row.name}}</span>
          <span style="font-size: 12px; color: #666; font-variant-numeric: tabular-nums;">{{row.side}}</span>
          <sc-if value="{{row.running}}" hint-placeholder-val="{{false}}"><span style="width: 28px; height: 3px; border-radius: 2px; background: #e1e1e1; position: relative;"><span style="position: absolute; left: 0; top: 0; height: 3px; width: 64%; border-radius: 2px; background: #171717;"></span></span></sc-if>
          <sc-if value="{{row.dot}}" hint-placeholder-val="{{false}}"><span style="width: 6px; height: 6px; border-radius: 3px; background: #a8a8a8;" title="Не расшифровано"></span></sc-if>
        </a>
      </sc-if>
    </sc-for>
  </sc-if>
  <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding: 10px 8px; font-size: 13px; color: #666;">
    <a href="#" style="display: flex; align-items: center; gap: 8px; color: #171717; text-decoration: none;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      Настройки
    </a>
    <span style="font-family: 'Geist Mono', monospace; font-size: 12px;">0.2.1</span>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"empty":{"editor":"boolean","default":false},"active":{"editor":"text","default":"Запись 10∶35"},"running":{"editor":"text","default":""},"$preview":{"width":232,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const empty = this.props.empty === true || this.props.empty === 'true';
    const active = this.props.active ?? 'Запись 10∶35';
    const base = 'display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 6px; text-decoration: none; color: inherit;';
    const items = [
      { label: 'Сегодня' },
      { name: 'Запись 10∶35', side: '0:12', dot: true },
      { name: 'Запись 09∶21', side: '0:06', dot: true },
      { name: 'Планерка отдела продаж', side: '48:00' },
      { label: 'Раньше' },
      { name: 'Созвон с подрядчиком', side: '42:10' },
      { name: 'Интервью с кандидатом', side: '1:04:33' },
    ];
    const rows = items.map((it) => it.label
      ? { isLabel: true, isItem: false, label: it.label }
      : { isLabel: false, isItem: true, name: it.name,
          running: it.name === (this.props.running ?? ''),
          side: it.name === (this.props.running ?? '') ? '64%' : it.side,
          dot: it.name === (this.props.running ?? '') ? false : !!it.dot,
          style: base + (it.name === active ? ' background: #ebebeb; font-weight: 500;' : '') });
    return { empty: empty, full: !empty, rows: rows };
  }
}
</script>
</body>
</html>
