<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Кинорежим с субтитрами</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#555}a:hover{color:#111}
</style>
</helmet>
<div style="width: 960px; height: 600px; display: flex; font-family: Inter, system-ui, sans-serif; color: #141414; background: #ffffff; overflow: hidden">
  <aside style="width: 220px; flex-shrink: 0; background: #f6f6f5; border-right: 1px solid #e6e6e3; padding: 16px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
    <div style="font-weight: 600; font-size: 20px; padding: 4px 6px">Tyto</div>
    <div style="height: 32px; border: 1px solid #e2e2df; border-radius: 8px; background: #fff; font-size: 13px; color: #8a8a86; display: flex; align-items: center; padding: 0 10px">Поиск</div>
    <div style="font-size: 12px; color: #6b6b67; padding: 6px 6px 0">Сегодня</div>
    <div style="background: #fff; border: 1px solid #e6e6e3; border-left: 2px solid #141414; border-radius: 8px; padding: 8px 10px">
      <div style="font-size: 13px; font-weight: 500">Планерка отдела продаж</div>
      <div style="font-size: 12px; color: #6b6b67">10:02 · 48 мин · видео</div>
    </div>
  </aside>
  <main style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: #0f1113">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 48px; font-size: 13px; color: #c9cbcd">
      <span style="font-weight: 500; color: #fff">Планерка отдела продаж</span>
      <div style="display: flex; gap: 4px; background: #23272b; border-radius: 8px; padding: 3px">
        <span style="padding: 5px 10px; border-radius: 6px; color: #c9cbcd">Текст</span>
        <span style="padding: 5px 10px; border-radius: 6px; background: #3a4047; color: #fff">Видео</span>
      </div>
    </div>
    <div style="flex: 1; min-height: 0; position: relative; margin: 0 20px; border-radius: 10px; background: #1d2126; overflow: hidden">
      <div style="position: absolute; left: 24px; top: 24px; width: 180px; height: 300px; background: #3a4047; border-radius: 4px"></div>
      <div style="position: absolute; left: 220px; top: 24px; width: 456px; height: 140px; background: #4b525a; border-radius: 4px"></div>
      <div style="position: absolute; left: 220px; top: 180px; width: 456px; height: 144px; background: #3a4047; border-radius: 4px"></div>
      <div style="position: absolute; left: 0; right: 0; bottom: 64px; display: flex; justify-content: center">
        <div style="max-width: 560px; background: rgba(0,0,0,0.72); color: #fff; border-radius: 6px; padding: 8px 12px; font-size: 15px; line-height: 1.45; text-align: center">
          <span style="color: #f3c07a; font-weight: 600">Говорящий 2: </span>Покажу на экране, что поменялось в карточке сделки.
        </div>
      </div>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: rgba(0,0,0,0.55)">
        <button type="button" aria-label="Воспроизвести" style="width: 32px; height: 32px; border: 0; border-radius: 8px; background: #fff; color: #141414; font-size: 12px">▶</button>
        <span style="font-size: 12.5px; color: #c9cbcd"><b style="color: #fff; font-weight: 500">00:42</b> / 48:10</span>
        <div style="flex: 1; height: 6px; border-radius: 3px; background: #4b525a; overflow: hidden"><div style="width: 9%; height: 6px; background: #fff"></div></div>
        <button type="button" aria-label="На весь экран" style="width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; color: #fff; font-size: 14px">⤢</button>
      </div>
    </div>
    <div style="height: 20px"></div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
